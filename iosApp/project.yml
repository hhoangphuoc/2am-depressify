# XcodeGen spec for the SwiftUI host. Generate with: cd iosApp && xcodegen generate
# Put the gitignored GoogleService-Info.plist and Secrets.plist in Depressify/ before generating, so
# they are bundled; without GoogleService-Info.plist the app uses the demo-twoam emulators.
name: Depressify
options:
  bundleIdPrefix: app.depressify
  deploymentTarget:
    iOS: "17.0"
packages:
  # The Firebase iOS SDK that the GitLive Kotlin SDK (2.8.0) in `shared` links against.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.3
targets:
  Depressify:
    type: application
    platform: iOS
    sources: [Depressify]
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: Depressify/Info.plist
      properties:
        CFBundleDisplayName: Depressify
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Depressify uses the microphone only during a voice Check-in with your Companion.
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          # Local Firebase emulators speak plain HTTP on 127.0.0.1 during development.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.depressify.patient
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
    preBuildScripts:
      - name: Compile Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
