<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2am · Patients</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <h1>Patients</h1>
      <div id="account" hidden>
        <span id="account-email"></span>
        <button id="sign-out" type="button" class="link">Sign out</button>
      </div>
    </header>

    <main>
      <p id="starting" class="muted">Loading…</p>

      <form id="sign-in" class="card" hidden novalidate>
        <h2>Clinician sign-in</h2>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p id="sign-in-error" class="error" role="alert" aria-live="assertive"></p>
        <button type="submit" class="primary">Sign in</button>
      </form>

      <section id="patients" hidden aria-labelledby="patients-heading">
        <h2 id="patients-heading" class="visually-hidden">Patient list</h2>
        <p id="patients-status" class="muted" aria-live="polite"></p>
        <table id="patients-table" hidden>
          <thead>
            <tr>
              <th scope="col">Patient</th>
              <th scope="col">Attention flag</th>
              <th scope="col">Reasons</th>
            </tr>
          </thead>
          <tbody id="patients-body"></tbody>
        </table>
      </section>

      <section id="patient" hidden aria-labelledby="patient-name"></section>
    </main>
  </body>
</html>
